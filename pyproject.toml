[project]
name = "auspexai-tenant"
dynamic = ["version"]
description = "Tenant SDK for the AuspexAI volunteer compute network"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "AuspexAI Maintainers", email = "contact@auspexai.network" },
]
keywords = ["auspexai", "distributed-compute", "ai-safety", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.5",
    "email-validator>=2.0",
    "click>=8.1",
    "cryptography>=42",
    "httpx>=0.27",
    "cbor2>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.16.2",
    "jsonschema>=4.20",
    # the evidence loader's analysis surface, exercised by tests
    "pandas>=2.0",
    "pyarrow>=15",
]
# EB-1 evidence loader (§9 #47 §6): `evidence.load_verified` -> a VERIFIED
# DataFrame; CSV/Parquet via the `bundle table` CLI. Deliberately optional --
# the core SDK stays light; analysis happens in the researcher's own tools.
#   pip install auspexai-tenant[analysis]
analysis = [
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.scripts]
auspexai-tenant = "auspexai_tenant.cli:main"

[project.urls]
Homepage = "https://auspexai.network"
Repository = "https://github.com/auspexai/tenant-sdk"
Documentation = "https://github.com/auspexai/tenant-sdk#readme"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version derived from git tags (hatch-vcs), stamped at build. See
# version_provenance.md (V-M1).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/auspexai_tenant"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "auspexai_tenant/schemas"
"cddl" = "auspexai_tenant/cddl"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/cddl",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
# lite.py is the VENDORABLE kit: its contract is the worker sandbox's system
# Python (3.10). UP017 rewrites timezone.utc into the 3.11-only datetime.UTC
# alias — the exact regression that broke the first D6 run.
"src/auspexai_tenant/lite.py" = ["UP017"]
"tests/**" = ["B011", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
]
